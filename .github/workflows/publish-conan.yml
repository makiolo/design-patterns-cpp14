name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.24
  workflow_dispatch:  # Allow manual trigger

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION=$(cat VERSION)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "Publishing version: $VERSION"
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            # design-patterns-cpp14 v${{ steps.version.outputs.version }}
            
            ## Header-only C++14 Design Patterns Library
            
            This release includes the Factory and Memoize design patterns implementation.
            
            ### Using This Release with Conan
            
            **Two easy ways to consume this package:**
            
            #### Option 1: Direct from Git Repository (Recommended)
            
            Conan can directly consume recipes from git repositories! Add this to your `conanfile.txt`:
            
            ```ini
            [requires]
            design-patterns-cpp14/${{ steps.version.outputs.version }}@
            
            [generators]
            CMakeDeps
            CMakeToolchain
            ```
            
            Then run:
            
            ```bash
            mkdir build && cd build
            conan install .. \
              --build=missing
            cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake
            cmake --build .
            ```
            
            Or from your `conanfile.py`:
            
            ```python
            from conan import ConanFile
            
            class MyProject(ConanFile):
                requires = "design-patterns-cpp14/${{ steps.version.outputs.version }}@"
                generators = "CMakeDeps", "CMakeToolchain"
            ```
            
            #### Option 2: Clone and Use Locally
            
            ```bash
            git clone https://github.com/makiolo/design-patterns-cpp14.git
            cd design-patterns-cpp14
            git checkout v${{ steps.version.outputs.version }}
            
            # In your project's conanfile.txt:
            [requires]
            design-patterns-cpp14/path/to/design-patterns-cpp14
            ```
            
            ### What's Included
            
            - ✅ **Header-only library** - No compilation needed
            - ✅ **Factory Pattern** - Dynamic object creation and registration
            - ✅ **Memoize Pattern** - Object caching and pooling
            - ✅ **Zero dependencies** - Only C++ standard library (C++14+)
            - ✅ **Cross-platform** - Works on Linux, macOS, Windows
            
            ### Compiler Support
            
            - GCC 4.9+
            - Clang 3.6+
            - MSVC 2015+
            
            ### Complete Documentation
            
            - 📖 [Main README](https://github.com/makiolo/design-patterns-cpp14/blob/master/README.md)
            - 📚 [Full Documentation](https://github.com/makiolo/design-patterns-cpp14/blob/master/docs/README.md)
            - 🚀 [Quick Start Guide](https://github.com/makiolo/design-patterns-cpp14/blob/master/docs/GITHUB_PACKAGES_SETUP.md)
            - 💡 [Example Project](https://github.com/makiolo/design-patterns-cpp14/tree/master/examples/consumer_project)
            
            ### Quick Example
            
            ```cpp
            #include <dp14/factory.h>
            #include <memory>
            
            class Shape { /* ... */ };
            class Circle : public Shape { /* ... */ };
            class Square : public Shape { /* ... */ };
            
            int main() {
                Shape::factory factory;
                Shape::factory::registrator<Circle> reg1(factory);
                Shape::factory::registrator<Square> reg2(factory);
                
                auto circle = factory.create<Circle>();
                auto square = factory.create<Square>();
                
                return 0;
            }
            ```
            
            ### Report Issues
            
            Found a bug? [Open an issue](https://github.com/makiolo/design-patterns-cpp14/issues)
            
          draft: false
          prerelease: false
